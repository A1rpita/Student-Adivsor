openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI Student Career, Skill & Scholarship Recommendation API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: career
    description: Career guidance and assessment
  - name: skills
    description: Skill recommendation and learning paths
  - name: scholarships
    description: Scholarship recommendations
  - name: chatbot
    description: AI Career Chatbot
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /career/assessment:
    post:
      operationId: submitAssessment
      tags: [career]
      summary: Submit personality assessment and get career recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssessmentRequest"
      responses:
        "200":
          description: Career recommendations based on assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssessmentResult"

  /career/roadmap/{career}:
    get:
      operationId: getCareerRoadmap
      tags: [career]
      summary: Get detailed roadmap for a career
      parameters:
        - name: career
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Career roadmap and details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerRoadmap"

  /career/list:
    get:
      operationId: listCareers
      tags: [career]
      summary: List all available careers
      responses:
        "200":
          description: List of careers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerListResponse"

  /skills/recommend:
    post:
      operationId: recommendSkills
      tags: [skills]
      summary: Get skill gap analysis and learning plan for a career
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRequest"
      responses:
        "200":
          description: Skill recommendations and learning plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRecommendationResult"

  /skills/careers:
    get:
      operationId: listSkillCareers
      tags: [skills]
      summary: List all careers available for skill recommendation
      responses:
        "200":
          description: List of careers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerListResponse"

  /scholarships/search:
    post:
      operationId: searchScholarships
      tags: [scholarships]
      summary: Search scholarships by student profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScholarshipSearchRequest"
      responses:
        "200":
          description: Matching scholarships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScholarshipSearchResult"

  /email/generate:
    post:
      operationId: generateEmails
      tags: [email]
      summary: Generate cold HR emails based on user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailGenerateRequest"
      responses:
        "200":
          description: Generated cold emails for target companies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailGenerateResponse"

  /chatbot/message:
    post:
      operationId: sendChatMessage
      tags: [chatbot]
      summary: Send a message to the AI career chatbot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chatbot response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    AssessmentRequest:
      type: object
      properties:
        answers:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 5
          description: "Answers to assessment questions, rated 1-5"
      required:
        - answers

    AssessmentQuestion:
      type: object
      properties:
        id:
          type: integer
        question:
          type: string
        type:
          type: string
          enum: [logic, creative, tech, communication]
      required:
        - id
        - question
        - type

    CareerMatch:
      type: object
      properties:
        career:
          type: string
        matchScore:
          type: number
        description:
          type: string
        requiredSkills:
          type: array
          items:
            type: string
      required:
        - career
        - matchScore
        - description
        - requiredSkills

    AssessmentResult:
      type: object
      properties:
        scores:
          type: object
          additionalProperties:
            type: number
        topCareers:
          type: array
          items:
            $ref: "#/components/schemas/CareerMatch"
        dominantTrait:
          type: string
      required:
        - scores
        - topCareers
        - dominantTrait

    CareerRoadmap:
      type: object
      properties:
        career:
          type: string
        description:
          type: string
        requiredSkills:
          type: array
          items:
            type: string
        steps:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        exams:
          type: array
          items:
            type: string
      required:
        - career
        - description
        - requiredSkills
        - steps
        - certifications
        - exams

    CareerListResponse:
      type: object
      properties:
        careers:
          type: array
          items:
            type: string
      required:
        - careers

    SkillRequest:
      type: object
      properties:
        career:
          type: string
        userSkills:
          type: array
          items:
            type: string
      required:
        - career
        - userSkills

    SkillRoadmapItem:
      type: object
      properties:
        skill:
          type: string
        difficulty:
          type: string
          enum: [Beginner, Intermediate, Advanced]
        weeks:
          type: integer
        demandScore:
          type: number
      required:
        - skill
        - difficulty
        - weeks
        - demandScore

    CourseItem:
      type: object
      properties:
        skill:
          type: string
        course:
          type: string
        platform:
          type: string
      required:
        - skill
        - course
        - platform

    SkillRecommendationResult:
      type: object
      properties:
        career:
          type: string
        existingSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        roadmap:
          type: array
          items:
            $ref: "#/components/schemas/SkillRoadmapItem"
        courses:
          type: array
          items:
            $ref: "#/components/schemas/CourseItem"
        certifications:
          type: array
          items:
            type: string
        exams:
          type: array
          items:
            type: string
        totalWeeks:
          type: integer
      required:
        - career
        - existingSkills
        - missingSkills
        - roadmap
        - courses
        - certifications
        - exams
        - totalWeeks

    ScholarshipSearchRequest:
      type: object
      properties:
        gender:
          type: string
          enum: [Male, Female, Other, All]
        category:
          type: string
        keyword:
          type: string
        maxIncome:
          type: number
      required: []

    ScholarshipItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        provider:
          type: string
        amount:
          type: string
        gender:
          type: string
        eligibility:
          type: string
      required:
        - id
        - name
        - provider
        - amount
        - gender
        - eligibility

    ScholarshipSearchResult:
      type: object
      properties:
        scholarships:
          type: array
          items:
            $ref: "#/components/schemas/ScholarshipItem"
        total:
          type: integer
      required:
        - scholarships
        - total

    ChatRequest:
      type: object
      properties:
        message:
          type: string
        history:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - message

    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content

    ChatResponse:
      type: object
      properties:
        response:
          type: string
        intent:
          type: string
      required:
        - response
        - intent

    EmailGenerateRequest:
      type: object
      properties:
        name:
          type: string
          description: Sender's full name
        jobRole:
          type: string
          description: Target job role (e.g. Frontend Developer)
        skills:
          type: array
          items:
            type: string
          description: List of the user's skills
        experience:
          type: string
          description: Brief experience summary (optional)
        tone:
          type: string
          enum: [formal, friendly, confident]
        companySize:
          type: string
          enum: [startup, small, medium, large]
        count:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
      required:
        - name
        - jobRole
        - skills
        - tone
        - companySize

    GeneratedEmail:
      type: object
      properties:
        company:
          type: string
        industry:
          type: string
        companySize:
          type: string
        subject:
          type: string
        body:
          type: string
      required:
        - company
        - industry
        - companySize
        - subject
        - body

    EmailGenerateResponse:
      type: object
      properties:
        emails:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedEmail"
        total:
          type: integer
      required:
        - emails
        - total
